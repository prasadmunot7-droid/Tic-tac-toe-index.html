<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Ultimate Tic Tac Toe</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: 'Poppins', sans-serif;
    color: white;

    background:
        radial-gradient(circle at 20% 20%, #6c63ff55, transparent 35%),
        radial-gradient(circle at 80% 80%, #ff4ecd44, transparent 35%),
        linear-gradient(135deg, #080b20, #15143a, #090b1d);

    display: flex;
    justify-content: center;
    align-items: center;

    overflow-x: hidden;
}

.container {
    width: 94%;
    max-width: 430px;
    text-align: center;
    padding: 20px 10px;
}

/* TITLE */

.title {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 1px;

    background: linear-gradient(
        90deg,
        #7c6cff,
        #ff55d9,
        #55d9ff
    );

  -webkit-background-clip: text;
    color: transparent;

    margin-bottom: 5px;
}

.subtitle {
    color: #b8b9d6;
    font-size: 13px;
    margin-bottom: 20px;
}

/* SCORE */

.scoreboard {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
}

.player-card {
    flex: 1;
    padding: 12px;

    border-radius: 18px;

    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);

    backdrop-filter: blur(15px);

    box-shadow:
        0 8px 25px rgba(0,0,0,0.25);
}

.player-card.x {
    border-bottom: 3px solid #5ed7ff;
}

.player-card.o {
    border-bottom: 3px solid #ff5bd8;
}

.player-name {
    font-size: 12px;
    color: #bfc0d8;
}

.score {
    font-size: 25px;
    font-weight: 800;
}

.x .score {
    color: #5ed7ff;
}

.o .score {
    color: #ff5bd8;
}

/* TURN */

.turn {
    margin-bottom: 15px;

    padding: 10px;

    border-radius: 15px;

    background: rgba(255,255,255,0.07);

    font-size: 14px;
    font-weight: 600;

    color: #e8e8ff;
}

/* GAME BOARD */

.board {
    width: 100%;
    aspect-ratio: 1;

    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;

    padding: 10px;

    border-radius: 25px;

    background: rgba(255,255,255,0.06);

    border: 1px solid rgba(255,255,255,0.12);

    box-shadow:
        0 15px 45px rgba(0,0,0,0.35);

    backdrop-filter: blur(15px);
}

.cell {
    border: none;
    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.13),
            rgba(255,255,255,0.045)
        );

    color: white;

    font-family: 'Poppins', sans-serif;

    font-size: 48px;
    font-weight: 800;

    cursor: pointer;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.1),
        0 5px 15px rgba(0,0,0,0.2);

    transition:
        transform 0.15s,
        background 0.2s,
        box-shadow 0.2s;
}

.cell:active {
    transform: scale(0.92);
}

.cell:hover {
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.2),
            rgba(255,255,255,0.08)
        );
}

.cell.x {
    color: #5ed7ff;

    text-shadow:
        0 0 10px #5ed7ff,
        0 0 25px #5ed7ff88;
}

.cell.o {
    color: #ff5bd8;

    text-shadow:
        0 0 10px #ff5bd8,
        0 0 25px #ff5bd888;
}

/* BUTTON */

.new-game {
    width: 100%;
    margin-top: 18px;

    padding: 14px;

    border: none;
    border-radius: 16px;

    font-family: 'Poppins', sans-serif;

    font-size: 15px;
    font-weight: 700;

    color: white;

    background:
        linear-gradient(
            90deg,
            #6258ff,
            #d84fff
        );

    box-shadow:
        0 8px 25px #754cff55;

    cursor: pointer;

    transition: 0.2s;
}

.new-game:active {
    transform: scale(0.96);
}

/* MESSAGE */

.message {
    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%) scale(0.8);

    width: 85%;
    max-width: 340px;

    padding: 30px 20px;

    border-radius: 25px;

    text-align: center;

    background:
        rgba(20,20,55,0.95);

    border: 1px solid rgba(255,255,255,0.15);

    box-shadow:
        0 20px 70px rgba(0,0,0,0.6);

    backdrop-filter: blur(20px);

    opacity: 0;
    pointer-events: none;

    transition: 0.3s;
}

.message.show {
    opacity: 1;
    pointer-events: auto;

    transform:
        translate(-50%, -50%)
        scale(1);
}

.winner-text {
    font-size: 28px;
    font-weight: 800;

    margin-bottom: 8px;

    background:
        linear-gradient(
            90deg,
            #5ed7ff,
            #ff5bd8
        );

    -webkit-background-clip: text;
    color: transparent;
}

.message p {
    color: #bfc0d8;
    font-size: 13px;
    margin-bottom: 18px;
}

.close-btn {
    border: none;

    padding: 11px 25px;

    border-radius: 12px;

    color: white;

    font-family: 'Poppins';

    font-weight: 600;

    background: linear-gradient(
        90deg,
        #6258ff,
        #d84fff
    );
}

/* SMALL SCREEN */

@media(max-width:350px) {

    .title {
        font-size: 27px;
    }

    .cell {
        font-size: 40px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1 class="title">TIC TAC TOE</h1>

    <p class="subtitle">
        First player to make 3 in a row wins!
    </p>

    <div class="scoreboard">

        <div class="player-card x">
            <div class="player-name">
                PLAYER X
            </div>

            <div class="score" id="scoreX">
                0
            </div>
        </div>

        <div class="player-card o">
            <div class="player-name">
                PLAYER O
            </div>

            <div class="score" id="scoreO">
                0
            </div>
        </div>

    </div>

    <div class="turn" id="turn">
        Player X's Turn
    </div>

    <div class="board">

        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>

        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>

        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>

    </div>

    <button class="new-game" onclick="newGame()">
        🔄 NEW GAME
    </button>

</div>


<!-- WINNER POPUP -->

<div class="message" id="message">

    <div class="winner-text" id="winnerText">
        PLAYER X WINS!
    </div>

    <p>
        Congratulations! 🎉
    </p>

    <button class="close-btn" onclick="newGame()">
        PLAY AGAIN
    </button>

</div>


<script>

const cells = document.querySelectorAll(".cell");

const turnText =
    document.getElementById("turn");

const scoreX =
    document.getElementById("scoreX");

const scoreO =
    document.getElementById("scoreO");

const message =
    document.getElementById("message");

const winnerText =
    document.getElementById("winnerText");


let board =
    ["","","","","","","","",""];

let currentPlayer = "X";

let playerMoves = {
    X: [],
    O: []
};

let scores = {
    X: 0,
    O: 0
};


/* WINNING COMBINATIONS */

const winningPatterns = [

    [0,1,2],
    [3,4,5],
    [6,7,8],

    [0,3,6],
    [1,4,7],
    [2,5,8],

    [0,4,8],
    [2,4,6]

];


/* CELL CLICK */

cells.forEach(cell => {

    cell.addEventListener("click", () => {

        const index =
            Number(cell.dataset.index);

        /* Already occupied */

        if (board[index] !== "") {
            return;
        }


        /*
        IMPORTANT:

        Each player can have
        maximum 3 marks.

        On 4th move:
        oldest mark disappears.
        */

        if (playerMoves[currentPlayer].length >= 3) {

            const oldest =
                playerMoves[currentPlayer].shift();

            board[oldest] = "";

            cells[oldest].textContent = "";

            cells[oldest].classList.remove(
                "x",
                "o"
            );
        }


        /* Put new mark */

        board[index] =
            currentPlayer;

        playerMoves[currentPlayer]
            .push(index);


        cell.textContent =
            currentPlayer;

        cell.classList.add(
            currentPlayer.toLowerCase()
        );


        /* Check winner */

        if (checkWinner()) {

            scores[currentPlayer]++;

            updateScore();

            winnerText.textContent =
                "PLAYER " +
                currentPlayer +
                " WINS!";

            message.classList.add("show");

            return;
        }


        /* Change player */

        currentPlayer =
            currentPlayer === "X"
            ? "O"
            : "X";


        turnText.textContent =
            "Player " +
            currentPlayer +
            "'s Turn";

    });

});


/* CHECK WINNER */

function checkWinner() {

    for (
        const pattern of winningPatterns
    ) {

        const [a,b,c] =
            pattern;

        if (
            board[a] !== "" &&
            board[a] === board[b] &&
            board[a] === board[c]
        ) {

            return true;
        }
    }

    return false;
}


/* SCORE */

function updateScore() {

    scoreX.textContent =
        scores.X;

    scoreO.textContent =
        scores.O;
}


/* NEW GAME */

function newGame() {

    board =
        ["","","","","","","","",""];

    currentPlayer = "X";

    playerMoves = {
        X: [],
        O: []
    };


    cells.forEach(cell => {

        cell.textContent = "";

        cell.classList.remove(
            "x",
            "o"
        );

    });


    turnText.textContent =
        "Player X's Turn";


    message.classList.remove(
        "show"
    );
}

</script>

</body>
</html>
